<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud Info Chatbot</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1b2430;--muted:#667085;--accent:#2563eb;--user:#2563eb;--bot:#e8eef7;--border:#d9e0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--text:#e6ebf2;--muted:#93a0b4;--accent:#5b8def;--user:#3b6fe0;--bot:#222d3f;--border:#2b3749}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#18212f;--text:#e6ebf2;--muted:#93a0b4;--accent:#5b8def;--user:#3b6fe0;--bot:#222d3f;--border:#2b3749}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card)}
h1{font-size:17px;margin:0}
#clear{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px}
#topics{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.chip{flex:none;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#qs{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}
.q{flex:none;max-width:260px;text-align:left;border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:10px;padding:6px 10px;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
form{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--border)}
input{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
#send{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 16px;font:inherit}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>☁️ Cloud Info Chatbot</h1><button id="clear">Clear</button></header>
<div id="topics"></div>
<div id="qs"></div>
<div id="chat"></div>
<form id="f"><input id="in" placeholder="Ask about the selected topic…" autocomplete="off"><button id="send">Send</button></form>
<script>
// ---- Project base: edit TOPICS to extend the bot ----
const TOPICS = {
  "Cloud Basics": ["What is cloud computing?","Explain IaaS vs PaaS vs SaaS","Public vs private vs hybrid cloud"],
  "AWS": ["What is EC2?","S3 vs EBS vs EFS","What is IAM?"],
  "Azure": ["What are Azure Virtual Machines?","Explain Azure Blob Storage","What is Azure Active Directory?"],
  "Google Cloud": ["What is Compute Engine?","What is BigQuery?","Cloud Storage classes"],
  "Security": ["Shared responsibility model","What is encryption at rest?","Best practices for IAM"],
  "Serverless": ["What is serverless?","Lambda vs Cloud Functions","Pros and cons of serverless"],
  "Cost": ["How does cloud pricing work?","Reserved vs on-demand vs spot","How to reduce cloud costs"]
};
let topic = Object.keys(TOPICS)[0];
let history = []; // [{role:'user'|'assistant', content}]
const $ = id => document.getElementById(id);
const chat = $("chat");

function renderTopics(){
  $("topics").innerHTML = "";
  Object.keys(TOPICS).forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"+(t===topic?" active":"");b.textContent=t;
    b.onclick=()=>{topic=t;renderTopics();renderQs();$("in").placeholder="Ask about "+t+"…";};
    $("topics").appendChild(b);
  });
}
function renderQs(){
  $("qs").innerHTML="";
  TOPICS[topic].forEach(q=>{
    const b=document.createElement("button");b.className="q";b.textContent=q;
    b.onclick=()=>ask(q);$("qs").appendChild(b);
  });
}
function render(){
  chat.innerHTML="";
  if(!history.length){
    const e=document.createElement("div");e.className="empty";
    e.textContent="Pick a topic, then tap a suggested question or type your own.";
    chat.appendChild(e);return;
  }
  history.forEach(m=>addBubble(m.role,m.content));
  chat.scrollTop=chat.scrollHeight;
}
function addBubble(role,text){
  const d=document.createElement("div");
  d.className="msg "+(role==="user"?"user":"bot");d.textContent=text;
  chat.appendChild(d);return d;
}

let busy=false, ctrl=null;
async function ask(text){
  text=text.trim();if(!text||busy)return;
  busy=true;$("send").disabled=true;
  history.push({role:"user",content:text});render();
  const bubble=addBubble("assistant","Thinking…");chat.scrollTop=chat.scrollHeight;
  const instructions="You are a helpful cloud computing tutor. Current topic: "+topic+
    ". Answer clearly in under 150 words, plain text, no markdown. If the question is unrelated to cloud computing, politely steer back to it.";
  const turns=[{role:"user",content:instructions+"\n\nConversation so far follows."},
    {role:"assistant",content:"Understood."},...history];
  try{
    const sample=await claude.use("sample");
    if(!sample) throw {code:"unavailable"};
    ctrl=new AbortController();
    const r=await sample(turns,{cache:false,signal:ctrl.signal,onText:({text})=>{bubble.textContent=text;chat.scrollTop=chat.scrollHeight;}});
    history.push({role:"assistant",content:r.text});
  }catch(e){
    if(e&&e.code==="cancelled"){bubble.remove();}
    else{bubble.textContent=e&&e.code==="unavailable"||e&&e.code==="not_granted"?"AI isn't available here. Allow access when prompted, or open this in claude.ai.":"Something went wrong. Please try again.";}
  }
  ctrl=null;busy=false;$("send").disabled=false;
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value;$("in").value="";ask(v);};
$("clear").onclick=()=>{if(ctrl)ctrl.abort();history=[];render();};
renderTopics();renderQs();render();
</script>
</body>
</html>
